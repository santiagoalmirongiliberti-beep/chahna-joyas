<style>
  :root{
    --ivory: #FFFFFF; --ivory-deep: #FFFFFF;
    --wine: #3F6150; --wine-deep: #2C4638;
    --gold: #A9824C; --gold-soft: #C7A165;
    --ink: #2B2420; --ink-soft: rgba(43,36,32,0.62);
  }
  *{ box-sizing: border-box; }
  body{ margin:0; background: var(--ivory); color: var(--ink); font-family: 'Jost', sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap{ max-width: 900px; margin: 0 auto; padding: 0 24px; }
  header{ padding: 64px 0 32px; text-align: center; }
  .brand{ font-family: 'Cormorant Garamond', serif; font-size: clamp(38px, 8vw, 60px); font-weight: 500; margin: 0; color: var(--wine-deep); }
  .brand-rule{ width: 64px; height: 2px; background: var(--gold); margin: 16px auto 18px; border: none; }
  .tagline{ font-size: 15px; color: var(--ink-soft); margin: 0; }
  main{ padding-bottom: 90px; min-height: 200px; }
  .grid{ display: grid; grid-template-columns: 1fr; gap: 22px; }
  @media (min-width: 700px){ .grid{ grid-template-columns: 1fr 1fr; } }
  .product{ background: var(--ivory-deep); border: 1px solid rgba(169,130,76,0.35); border-radius: 4px; display: flex; flex-direction: column; overflow: hidden; }
  .product-art{ background: linear-gradient(160deg, var(--wine) 0%, var(--wine-deep) 100%); display: flex; align-items: center; justify-content: center; padding: 20px; min-height: 260px; }
  .product-art svg{ width: 100%; max-width: 130px; height: auto; }
  .product-art.con-foto{ padding: 0; min-height: 0; aspect-ratio: 1 / 1; background: var(--ivory-deep); }
  .product-art.con-foto img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .product-info{ padding: 26px 24px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .product-category{ font-size: 12px; letter-spacing: 0.04em; color: var(--gold); margin: 0 0 2px; }
  .product-code{ font-size: 12px; color: var(--ink-soft); margin: 0; }
  .product-name{ font-family: 'Cormorant Garamond', serif; font-size: 27px; font-weight: 600; margin: 0; }
  .product-price{ font-size: 19px; color: var(--wine); margin: 4px 0 2px; }
  .product-specs{ font-size: 17px; font-weight: 700; color: var(--ink); margin: 0; }
  .product-medida, .item-info .product-medida{ display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 16px; margin: 4px 0 6px; color: var(--ink); }
  .product-medida span{ font-weight: 500; }
  .product-medida span + span::before{ content: "·"; margin-right: 10px; color: var(--gold, #a9824c); }
  .product-stock{ font-size: 17px; font-weight: 700; color: var(--ink); margin: 0 0 16px; }
  .product-stock strong{ color: var(--ink); font-weight: 700; }
  .agotado-tag{ color: var(--wine); font-weight: 500; }
  .cta{ display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--wine); color: var(--ivory); text-decoration: none; font-size: 14px; padding: 12px 20px; border-radius: 3px; width: fit-content; margin-top: auto; transition: background 0.2s ease; border:none; cursor:pointer; }
  .cta:hover{ background: var(--wine-deep); }
  .cta:disabled{ background: rgba(43,36,32,0.25); cursor: default; }
  .cta svg{ width: 15px; height: 15px; flex-shrink: 0; }
  /* Piezas sin stock: se ven opacadas y no se pueden consultar */
  .product.agotado{ opacity: 0.5; }
  .product.agotado .product-art{ filter: grayscale(0.8); }
  .product.agotado .cta:disabled{ cursor: not-allowed; }
  .cat-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (min-width: 700px){ .cat-grid{ grid-template-columns: repeat(3, 1fr); gap: 22px; } }
  .cat-tile{ position: relative; display: flex; align-items: flex-end; aspect-ratio: 4 / 5; border-radius: 4px; overflow: hidden; text-decoration: none; color: #fff; border: 1px solid rgba(169,130,76,0.35); background: linear-gradient(160deg, var(--wine) 0%, var(--wine-deep) 100%); }
  .cat-tile img{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
  .cat-tile:hover img{ transform: scale(1.04); }
  .cat-tile .cat-icon{ position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-bottom: 40px; }
  .cat-tile .cat-icon svg{ width: 45%; max-width: 110px; height: auto; }
  .cat-tile::after{ content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(30,45,37,0.78) 0%, rgba(30,45,37,0) 55%); }
  .cat-label{ position: relative; z-index: 1; padding: 16px 18px; }
  .cat-name{ font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; margin: 0; line-height: 1.1; }
  .cat-count{ font-size: 12px; opacity: 0.85; margin: 4px 0 0; }
  .barra{ display: flex; align-items: center; gap: 16px; margin: 0 0 28px; flex-wrap: wrap; }
  .volver{ font-family: 'Jost', sans-serif; font-size: 14px; background: transparent; border: 1px solid rgba(63,97,80,0.35); color: var(--wine); padding: 9px 18px; border-radius: 999px; text-decoration: none; transition: background 0.2s ease, color 0.2s ease; }
  .volver:hover{ background: var(--wine); color: var(--ivory); }
  .titulo-cat{ font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 600; margin: 0; color: var(--wine-deep); }
  .vacio{ text-align: center; color: var(--ink-soft); font-size: 14px; padding: 30px 0; }
  .status-msg{ text-align: center; color: var(--ink-soft); font-size: 14px; padding: 30px 0; }

  /* Buscador */
  .buscador-caja{ position: relative; max-width: 560px; margin: 0 auto; }
  .buscador-caja input{ width: 100%; font-family: 'Jost', sans-serif; font-size: 16px; color: var(--ink); background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233F6150' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>") no-repeat 16px center / 20px; border: 1px solid rgba(63,97,80,0.35); border-radius: 999px; padding: 14px 20px 14px 46px; outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
  .buscador-caja input:focus{ border-color: var(--wine); box-shadow: 0 0 0 3px rgba(63,97,80,0.14); }
  .buscador-caja input::placeholder{ color: var(--ink-soft); }
  .sugerencias{ position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 30; background: #fff; border: 1px solid rgba(169,130,76,0.35); border-radius: 8px; box-shadow: 0 14px 34px rgba(30,45,37,0.16); max-height: 70vh; overflow-y: auto; }
  .sugerencias[hidden]{ display: none; }
  .sug{ display: flex; align-items: center; gap: 14px; padding: 10px 14px; cursor: pointer; }
  .sug + .sug{ border-top: 1px solid rgba(169,130,76,0.15); }
  .sug:hover, .sug.activa{ background: #f1f7f3; }
  .sug-foto{ width: 56px; height: 56px; flex-shrink: 0; border-radius: 4px; overflow: hidden; background: linear-gradient(160deg, var(--wine) 0%, var(--wine-deep) 100%); display: flex; align-items: center; justify-content: center; }
  .sug-foto img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .sug-foto svg{ width: 55%; height: auto; }
  .sug-nombre{ font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; line-height: 1.15; color: var(--ink); }
  .sug-detalle{ font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .sug.agotado{ opacity: 0.55; }
  .sug.agotado .sug-foto{ filter: grayscale(0.8); }
  .sug-vacio, .sug-mas{ padding: 14px 16px; font-size: 13px; color: var(--ink-soft); text-align: center; }
  mark{ background: #cfe6d6; color: inherit; border-radius: 2px; padding: 0 1px; }
  .product.destacada{ box-shadow: 0 0 0 3px rgba(63,97,80,0.45); }
  footer{ text-align: center; padding: 30px 24px 50px; font-size: 13px; color: var(--ink-soft); }
  footer a{ color: var(--wine); text-decoration: none; }

  /* ESCALÓN 1: cabecera fija con el logo y el nombre debajo. Solo una sombra la separa del stock. */
  .cabecera{ position: sticky; top: 0; z-index: 40; background: #fff; text-align: center; padding: 10px 0 12px; box-shadow: 0 8px 22px rgba(44,70,56,0.16); }
  .cabecera-marca svg{ width: 76px; height: 76px; display: block; margin: 0 auto; }
  .lupa-btn, .atras-btn{ position: absolute; left: 32px; top: 50%; transform: translateY(-50%); width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; padding: 0; background: #fff; border: 2px solid #1c1c1c; border-radius: 999px; cursor: pointer; z-index: 3; transition: box-shadow 0.2s ease; }
  .lupa-btn[hidden], .atras-btn[hidden]{ display: none; }
  .lupa-btn:hover, .atras-btn:hover{ box-shadow: 0 0 0 3px rgba(0,0,0,0.15); }
  .lupa-btn svg, .atras-btn svg{ width: 30px; height: 30px; }
  .panel-busqueda{ display: none; align-items: center; justify-content: center; min-height: 105px; padding: 0 108px; position: relative; }
  .cabecera.buscando .cabecera-marca, .cabecera.buscando .lupa-btn{ display: none; }
  .atras-btn{ display: none; }
  .cabecera.buscando .atras-btn{ display: flex; }
  .cabecera.buscando .panel-busqueda{ display: flex; }
  .panel-busqueda > #buscador{ width: 100%; }
  .cabecera-nombre{ font-family: 'Cormorant Garamond', serif; font-size: 23px; font-weight: 600; line-height: 1.1; margin: 4px 0 0; color: var(--wine-deep); }

  /* ESCALÓN 2: buscador, categorías y stock, directamente debajo, sin nada en el medio. */
  .escalon{ position: relative; z-index: 1; background: #fff; padding-top: 28px; }

  /* Precio clickeable y pestaña de cobro */
  #pago{ max-width: 560px; margin: 0 auto; }
  .pago-resumen{ display: flex; gap: 14px; align-items: center; border: 1px solid rgba(169,130,76,0.35); border-radius: 4px; padding: 12px; }
  .pago-resumen .sug-foto{ width: 72px; height: 72px; }
  .pago-resumen h3{ font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; margin: 0; line-height: 1.15; }
  .pago-resumen p{ margin: 2px 0 0; font-size: 14px; color: var(--ink-soft); }
  .pago-bloque{ margin-top: 22px; }
  .pago-bloque h4{ font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; margin: 0 0 10px; color: var(--wine-deep); }
  .cantidad{ display: flex; align-items: center; gap: 14px; }
  .cantidad button{ width: 38px; height: 38px; border-radius: 999px; border: 1px solid rgba(63,97,80,0.4); background: #fff; color: var(--wine); font-size: 20px; cursor: pointer; }
  .cantidad button:disabled{ opacity: 0.35; cursor: default; }
  .cantidad output{ min-width: 24px; text-align: center; font-size: 18px; }
  .pago-total{ display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(169,130,76,0.25); }
  .pago-total strong{ font-size: 26px; color: var(--wine-deep); font-weight: 500; }
  .metodos{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metodo{ font-family: 'Jost', sans-serif; font-size: 14px; padding: 12px 10px; background: #fff; border: 1px solid rgba(63,97,80,0.35); border-radius: 6px; color: var(--ink); cursor: pointer; }
  .metodo.activo{ border-color: var(--wine); background: #f1f7f3; box-shadow: 0 0 0 2px rgba(63,97,80,0.18); }
  .cuenta{ border: 1px solid rgba(169,130,76,0.35); border-radius: 6px; padding: 14px 16px; margin-top: 12px; }
  .cuenta-titulo{ font-weight: 500; margin: 0 0 8px; }
  .dato{ display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; font-size: 14px; }
  .dato + .dato{ border-top: 1px solid rgba(169,130,76,0.15); }
  .dato small{ display: block; font-size: 11px; color: var(--ink-soft); }
  .dato span{ word-break: break-all; }
  .copiar{ font-family: 'Jost', sans-serif; font-size: 12px; background: transparent; border: 1px solid rgba(63,97,80,0.4); color: var(--wine); border-radius: 999px; padding: 5px 12px; cursor: pointer; flex-shrink: 0; }
  .copiar.ok{ background: var(--wine); color: #fff; }
  .pago-campo{ width: 100%; font-family: 'Jost', sans-serif; font-size: 16px; padding: 13px 16px; border: 1px solid rgba(63,97,80,0.35); border-radius: 6px; outline: none; }
  .pago-campo:focus{ border-color: var(--wine); box-shadow: 0 0 0 3px rgba(63,97,80,0.14); }
  .pago-nota{ font-size: 15px; font-weight: 500; color: var(--ink); line-height: 1.45; margin: 12px 0 0; }
  #pago .cta{ width: 100%; margin-top: 14px; font-size: 15px; padding: 14px 20px; }

  /* Paso a paso del carrito */
  .tit-seccion{ font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; margin: 0 0 12px; color: var(--wine-deep); }
  .paso{ margin-top: 28px; transition: opacity 0.2s ease; }
  .paso-cab{ display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .paso-cab h4{ font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; margin: 0; color: var(--wine-deep); line-height: 1.1; }
  .paso-num{ width: 34px; height: 34px; flex-shrink: 0; border-radius: 999px; background: var(--wine); color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; transition: background 0.2s ease; }
  .paso.hecho .paso-num{ background: var(--gold); }
  .paso.hecho .paso-num span{ display: none; }
  .paso.hecho .paso-num::after{ content: "\2713"; font-family: 'Jost', sans-serif; font-size: 17px; }
  .paso.bloqueado{ opacity: 0.5; }
  .paso.bloqueado .pago-campo{ background: #f6f6f6; cursor: not-allowed; }
  .compra{ margin-top: 4px; }
  .compra[hidden]{ display: none; }
  .compra-texto strong{ font-weight: 700; }

  /* Cartel de confirmación antes de ir a WhatsApp */
  .confirmar{ position: fixed; inset: 0; z-index: 100; background: rgba(30,45,37,0.55); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .confirmar[hidden]{ display: none; }
  .confirmar-caja{ background: #fff; border: 1px solid rgba(169,130,76,0.35); border-radius: 8px; box-shadow: 0 18px 44px rgba(30,45,37,0.28); max-width: 420px; width: 100%; padding: 28px 24px 22px; text-align: center; }
  .confirmar-caja h3{ font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; margin: 0 0 10px; color: var(--wine-deep); line-height: 1.15; }
  .confirmar-caja p{ font-size: 15px; font-weight: 500; line-height: 1.5; color: var(--ink); margin: 0 0 6px; }
  .confirmar-acciones{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .confirmar-acciones .cta, .confirmar-acciones .volver{ width: 100%; margin: 0; font-size: 15px; padding: 13px 10px; cursor: pointer; text-align: center; }
  .compra-texto{ font-size: 15px; font-weight: 500; line-height: 1.5; color: var(--ink); background: #f1f7f3; border: 1px solid rgba(63,97,80,0.25); border-radius: 6px; padding: 12px 14px; margin: 0 0 14px; }

  /* Carrito */
  .carrito-btn{ position: absolute; right: 32px; top: 50%; transform: translateY(-50%); width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; padding: 0; background: #fff; border: 2px solid #1c1c1c; border-radius: 999px; cursor: pointer; z-index: 3; transition: box-shadow 0.2s ease; }
  .carrito-btn:hover{ box-shadow: 0 0 0 3px rgba(0,0,0,0.15); }
  .carrito-btn svg{ width: 30px; height: 30px; }
  .carrito-n{ position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--wine); color: #fff; font-size: 12px; line-height: 22px; text-align: center; font-weight: 500; }
  .carrito-n[hidden]{ display: none; }
  .reserva{ text-align: center; font-size: 14px; background: #f1f7f3; border: 1px solid rgba(63,97,80,0.25); border-radius: 6px; padding: 10px 14px; margin: 0 0 16px; color: var(--wine-deep); }
  .reserva strong{ font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .cta.ok{ background: var(--gold); }
  .item{ display: flex; gap: 14px; align-items: center; border: 1px solid rgba(169,130,76,0.35); border-radius: 4px; padding: 12px; margin-bottom: 12px; }
  .item .sug-foto{ width: 72px; height: 72px; }
  .item-info{ flex: 1; min-width: 0; }
  .item-info h3{ font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; margin: 0; line-height: 1.15; }
  .item-info p{ margin: 2px 0 6px; font-size: 14px; color: var(--ink-soft); }
  .item .cantidad button{ width: 32px; height: 32px; font-size: 18px; }
  .item .cantidad{ gap: 10px; }
  .item-sub{ text-align: right; font-size: 16px; color: var(--wine-deep); white-space: nowrap; }
  .quitar{ display: block; margin-top: 6px; font-family: 'Jost', sans-serif; font-size: 12px; background: none; border: none; color: var(--ink-soft); text-decoration: underline; cursor: pointer; padding: 0; margin-left: auto; }
  .product{ cursor: pointer; }

  /* Ventana ampliada del producto: foto a la izquierda, datos a la derecha (en celular, debajo) */
  .detalle{ position: fixed; inset: 0; z-index: 90; background: rgba(30,45,37,0.6); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .detalle[hidden]{ display: none; }
  .detalle-caja{ position: relative; background: #fff; border-radius: 6px; width: 100%; max-width: 1200px; max-height: 92vh; overflow-y: auto; box-shadow: 0 18px 44px rgba(30,45,37,0.28); display: grid; grid-template-columns: 1fr; }
  /* El contenedor interno no debe apilar la foto y los datos: sus hijos se acomodan directo en la grilla */
  #detalleCuerpo{ display: contents; }
  @media (min-width: 700px){
    .detalle-caja{ grid-template-columns: 1.8fr 1fr; grid-template-rows: minmax(0, 1fr); height: min(88vh, 780px); max-height: none; overflow: hidden; }
    .detalle-foto{ aspect-ratio: auto; height: 100%; min-height: 0; overflow: hidden; }
    .detalle-info{ min-height: 0; overflow-y: auto; }
  }
  .detalle-cerrar{ position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(63,97,80,0.35); background: #fff; color: var(--wine); font-size: 24px; line-height: 1; cursor: pointer; z-index: 2; }
  .detalle-foto{ position: relative; aspect-ratio: 1 / 1; background: linear-gradient(160deg, var(--wine) 0%, var(--wine-deep) 100%); display: flex; align-items: center; justify-content: center; }
  .detalle-foto.con-foto{ background: var(--ivory-deep); }
  .detalle-foto img{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .detalle-foto svg{ width: 45%; max-width: 200px; height: auto; padding: 40px 0; }
  .detalle-info{ padding: 36px 30px; display: flex; flex-direction: column; gap: 8px; }
  .detalle-info .product-name{ font-size: 34px; }
  .detalle-info .btn-carrito{ margin-top: 18px; }
  /* Celular: dos piezas por fila, con un formato más liviano y estilizado */
  @media (max-width: 699px){
    .wrap{ padding: 0 12px; }
    .grid{ grid-template-columns: 1fr 1fr; gap: 28px 12px; }
    .product{ border: 1px solid rgba(169,130,76,0.35); border-radius: 4px; background: #fff; }
    .product-art{ min-height: 0; aspect-ratio: 1 / 1; padding: 0; background: #f6f6f6; }
    .product-art svg{ max-width: 60%; }
    .product-art.con-foto{ background: #f6f6f6; }
    .product-info{ padding: 10px 10px 12px; gap: 3px; }

<body>

  <!-- ESCALÓN 2: categorías y stock -->
  <section class="escalon" id="escalon">

      <div class="cat-grid" id="catGrid"></div>
      <div class="grid" id="grid"></div>

    </main>
  </section>

  <div class="confirmar" id="confirmar" role="dialog" aria-modal="true" aria-labelledby="confirmarTitulo" hidden>
    <div class="confirmar-caja">
      <h3 id="confirmarTitulo">¿Estás seguro de realizar la compra?</h3>

      <div class="confirmar-acciones">
        <button type="button" class="volver" id="confirmarNo">Cancelar</button>
        <button type="button" class="cta" id="confirmarSi">Sí, comprar</button>
      </div>
    </div>
  </div>

  <footer>
    Chahna Joyas · pedidos por <a href="https://wa.me/5493516804728" target="_blank" rel="noopener">WhatsApp</a>
  </footer>

<script>
  // ⚠️ URL del Apps Script (termina en /exec)
  const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzmbLqrGFRqhc1PgIxIHpBLxFPO67Ibl-R6X1JZuuQmUSiaaT1SCtEYWaxmbu35c1NcVw/exec";

  const WHATSAPP_NUMBER = "5493512709924";

  // DATOS PARA COBRAR. tipo: "naranjax" o "banco" (transferencia bancaria).
  const CUENTAS_PAGO = [
    { tipo: "naranjax", nombre: "Naranja X",               titular: "Cinthia Mariela Giliberti Marin", alias: "chahnanx",           cvu: "4530000800013137431243" },
    { tipo: "banco",    nombre: "Transferencia bancaria",  titular: "Cinthia Mariela Giliberti Marin", alias: "salta.salta.langosta", cvu: "0200917311000067615908" }
  ];

  // true = las piezas sin stock no se muestran. false = se muestran al final como "Agotado".
  const OCULTAR_AGOTADOS = false;

  const FOTO_GENERICA = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="50" cy="50" r="24" fill="none" stroke="#C7A165" stroke-width="3.5"/>
  </svg>`;

  const WA_ICON = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.1.2-.3.2-.5.1-.3-.1-1.2-.4-2.2-1.4-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.4.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.2-.4.1-.2 0-.3 0-.4-.1-.1-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.3-.8.8-.8 1.9s.8 2.2.9 2.4c.1.2 1.6 2.4 3.8 3.4.5.2.9.4 1.3.5.5.2 1 .1 1.4.1.4-.1 1.3-.5 1.5-1.1.2-.5.2-1 .1-1.1 0-.1-.2-.2-.4-.3z"/><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3a8.2 8.2 0 1 1 7.2 3.9z"/></svg>`;

  let productos = [];

  const CARRITO_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.4l2.1 11h9.6l2-8H6.4"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>`;

  // Carrito: { codigoDePieza: cantidad }. Se guarda en el navegador para que no se pierda al recargar.
  // Las piezas quedan en el carrito sin límite de tiempo.
  let carrito = {};
  try{
    const g = JSON.parse(localStorage.getItem("chahna_carrito") || "null");
    if(g && g.items && typeof g.items === "object") carrito = g.items;
  }catch(e){ carrito = {}; }
  function guardarCarrito(){
    try{ localStorage.setItem("chahna_carrito", JSON.stringify({ items: carrito })); }catch(e){}
    actualizarInsignia();
  }
  function actualizarInsignia(){
    const n = Object.values(carrito).reduce((a, b) => a + b, 0);
    const el = document.getElementById("carritoN");
    el.textContent = n; el.hidden = n === 0;
  }
  function productoPorId(id){ return productos.find(x => String(x.id) === String(id)); }
  // Acomoda el carrito a lo que hay en stock hoy
  function limpiarCarrito(){
    Object.keys(carrito).forEach(id => {
      const pr = productoPorId(id);
      const max = pr ? (Number(pr.stock) || 0) : 0;
      if(!pr || max <= 0) delete carrito[id];
      else carrito[id] = Math.min(Math.max(1, carrito[id]), max);
    });
    guardarCarrito();
  }

  function formatoPrecio(n){
    const num = Number(n) || 0;
    return num > 0 ? "$" + num.toLocaleString("es-AR") : "—";
  }

  function esc(t){ return String(t == null ? "" : t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function norm(t){ return String(t == null ? "" : t).trim().toLowerCase(); }
  function fotoHD(url, w){ return String(url).replace(/sz=w\d+/, "sz=w" + w); }
  function tieneStock(p){ return (Number(p.stock) || 0) > 0; }

  // Peso (columna F) y tamaño (columna G) de la planilla, en negrita
  function medidasHTML(p){
    const v = x => (x === null || x === undefined) ? "" : String(x).trim();
    const peso = v(p.peso), tamano = v(p.tamano !== undefined ? p.tamano : p["tamaño"]);
    const partes = [peso, tamano].filter(Boolean).map(x => `<span>${esc(x)}</span>`);
    return partes.length ? `<p class="product-medida">${partes.join("")}</p>` : "";
  }

  function lista(){
    return OCULTAR_AGOTADOS ? productos.filter(tieneStock) : productos;
  }

  // Agrupa por una clave (categoría o código) respetando el orden de aparición
  function agrupar(items, keyFn, labelFn){
    const mapa = new Map();
    items.forEach(p => {
      const key = keyFn(p);
      if(!key) return;
      if(!mapa.has(key)) mapa.set(key, { key, label: labelFn(p), disponibles: 0, foto: "" });
      const g = mapa.get(key);
      if(tieneStock(p)) g.disponibles++;
      if(!g.foto && p.foto && String(p.foto).trim()) g.foto = p.foto;
    });
    return [...mapa.values()];
  }

  function obtenerGrupos(){
    return agrupar(lista(), p => norm(p.categoria), p => p.categoria);
  }

  function obtenerTipos(grupoKey){
    return agrupar(
      lista().filter(p => norm(p.categoria) === grupoKey),
      p => norm(p.codigo),
      p => p.tipo
    );
  }

  function tiles(items, hrefFn){
    return items.map(c => `
      <a class="cat-tile" href="${hrefFn(c)}">
        ${c.foto
          ? `<img src="${esc(fotoHD(c.foto, 600))}" alt="${esc(c.label)}" loading="lazy">`
          : `<div class="cat-icon">${FOTO_GENERICA}</div>`}
        <div class="cat-label">
          <h2 class="cat-name">${esc(c.label)}</h2>
        </div>
      </a>`).join("");
  }

  // Nivel 1: Aros, Anillos, Dijes, Pulseras...
  function renderGrupos(){
    document.getElementById("catGrid").innerHTML =
      tiles(obtenerGrupos(), c => "#" + encodeURIComponent(c.key));
  }

  // Nivel 2: tipos dentro de un grupo (Aro brillo, Aro colgante liso...)
  function renderTipos(grupo){
    document.getElementById("catGrid").innerHTML =
      tiles(obtenerTipos(grupo.key), c => "#" + encodeURIComponent(grupo.key) + "/" + encodeURIComponent(c.key));
  }

  // Nivel 3: las piezas de un tipo
  function renderGrid(grupoKey, tipoKey){
    const grid = document.getElementById("grid");
    const visibles = lista()
      .filter(p => norm(p.categoria) === grupoKey && norm(p.codigo) === tipoKey)
      .sort((a, b) => Number(!tieneStock(a)) - Number(!tieneStock(b))); // agotados al final

    if(!visibles.length){
      grid.innerHTML = `<p class="vacio">No hay piezas en esta categoría.</p>`;
      return;
    }

    grid.innerHTML = visibles.map(p => {
      const stock = Number(p.stock) || 0;
      const agotado = stock <= 0;

      let foto;
      let conFoto = false;
      if (p.foto && String(p.foto).trim()) {
        foto = `<img src="${esc(fotoHD(p.foto, 1200))}" alt="${esc(p.nombre)}" loading="lazy">`;
        conFoto = true;
      } else {
        foto = FOTO_GENERICA;
      }

      return `
        <article class="product${agotado ? ' agotado' : ''}" data-id="${esc(p.id)}">
          <div class="product-art${conFoto ? ' con-foto' : ''}">${foto}</div>
          <div class="product-info">
            <button type="button" class="tarjeta-compartir" data-compartir="${esc(p.id)}" aria-label="Compartir">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            </button>
            <h2 class="product-name">${esc(p.nombre)}</h2>
            ${Number(p.precio) > 0 ? `<p class="product-price">${formatoPrecio(p.precio)}</p>` : ""}
            ${medidasHTML(p)}
            <p class="product-specs">${esc(p.especificaciones)}</p>
            <p class="product-stock">${agotado
              ? `<span class="agotado-tag">Stock no disponible</span>`
              : `<strong>Stock disponible</strong>`}</p>
            <button type="button" class="cta btn-carrito" data-id="${esc(p.id)}"${agotado ? " disabled" : ""}>${CARRITO_ICON} Añadir al carrito</button>
          </div>
        </article>`;
    }).join("");
  }


  // ---------- Carrito y cobro ----------
  const COPIAR_ICONO = "Copiar";
  function copiarTexto(texto, btn){
    const listo = () => { btn.classList.add("ok"); btn.textContent = "¡Copiado!"; setTimeout(() => { btn.classList.remove("ok"); btn.textContent = COPIAR_ICONO; }, 1500); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(texto).then(listo, () => {}); }
    else{ const t = document.createElement("textarea"); t.value = texto; document.body.appendChild(t); t.select(); try{ document.execCommand("copy"); listo(); }catch(e){} t.remove(); }
  }

  function agregarAlCarrito(id, btn){
    const pr = productoPorId(id);
    if(!pr) return;
    const max = Number(pr.stock) || 0;
    const actual = carrito[id] || 0;
    const original = btn.innerHTML;
    if(actual >= max){
      btn.textContent = "Ya tenés todas las piezas";
    }else{
      carrito[id] = actual + 1;
      guardarCarrito();
      btn.classList.add("ok");
      btn.textContent = "¡Añadido!";
    }
    setTimeout(() => { btn.classList.remove("ok"); btn.innerHTML = original; }, 1300);
  }

  let metodoPago = "";   // empieza sin elegir: el cliente lo elige en el paso 1
  let nombreCliente = "";
  let codigoRecomendacion = "";   // código del revendedor (opcional), formato A001
  function codigoValido(c){ return /^[A-Z]\d{3}$/.test(c); }

  function renderCarrito(){
    const cont = document.getElementById("pago");
    limpiarCarrito();
    const ids = Object.keys(carrito);

    if(!ids.length){
      cont.innerHTML = `<p class="vacio">Tu carrito está vacío.</p><a class="cta" href="#" style="margin:0 auto">Ver las joyas</a>`;
      return;
    }

    const filas = ids.map(id => {
      const pr = productoPorId(id);
      const q = carrito[id];
      const max = Number(pr.stock) || 0;
      const mini = (pr.foto && String(pr.foto).trim()) ? `<img src="${esc(fotoHD(pr.foto, 200))}" alt="">` : FOTO_GENERICA;
      return `
        <div class="item" data-id="${esc(id)}">
          <div class="sug-foto">${mini}</div>
          <div class="item-info">
            <h3>${esc(pr.nombre)}</h3>
            <p>${formatoPrecio(pr.precio)} c/u</p>
            ${medidasHTML(pr)}
            <div class="cantidad">
              <button type="button" data-a="menos" ${q <= 1 ? "disabled" : ""} aria-label="Menos">−</button>
              <output>${q}</output>
              <button type="button" data-a="mas" ${q >= max ? "disabled" : ""} aria-label="Más">+</button>
            </div>
          </div>
          <div class="item-sub">${formatoPrecio(q * Number(pr.precio))}<button type="button" class="quitar" data-a="quitar">Quitar</button></div>
        </div>`;
    }).join("");

    const total = ids.reduce((suma, id) => suma + carrito[id] * Number(productoPorId(id).precio), 0);
    const hayNX = CUENTAS_PAGO.some(c => c.tipo === "naranjax");
    const hayBanco = CUENTAS_PAGO.some(c => c.tipo === "banco");
    if(metodoPago === "naranjax" && !hayNX && hayBanco) metodoPago = "banco";

    cont.innerHTML = `
      <h3 class="tit-seccion">Tu pedido</h3>
      ${filas}
      <div class="pago-total"><span>Total a pagar</span><strong>${formatoPrecio(total)}</strong></div>

      <div class="paso${metodoPago ? " hecho" : ""}" id="paso1">
        <div class="paso-cab"><div class="paso-num"><span>1</span></div><h4>Elegí tu método de pago</h4></div>
        <div class="metodos" id="metodos">
          <button type="button" class="metodo${metodoPago === "naranjax" ? " activo" : ""}" data-m="naranjax">Naranja X</button>
          <button type="button" class="metodo${metodoPago === "banco" ? " activo" : ""}" data-m="banco">Transferencia bancaria</button>
        </div>
        <div id="cuentas">${cuentasHtml()}</div>
        ${metodoPago ? `<p class="pago-nota">Transferí el total a esta cuenta. Después vas a poder enviarnos el comprobante por WhatsApp.</p>` : ""}
      </div>

      <div class="paso${codigoValido(codigoRecomendacion) ? " hecho" : ""}" id="paso2">
        <div class="paso-cab"><div class="paso-num"><span>2</span></div><h4>¿Te recomendó alguien la página? <small>(opcional)</small></h4></div>
        <input class="pago-campo" id="codigoRev" type="text" placeholder="Código, ej. A001" maxlength="4" autocomplete="off" value="${esc(codigoRecomendacion)}">
      </div>

      <div class="paso${metodoPago ? "" : " bloqueado"}" id="paso3">
        <div class="paso-cab"><div class="paso-num"><span>3</span></div><h4>Completá tus datos</h4></div>
        <input class="pago-campo" id="cliente" type="text" placeholder="Nombre y apellido" autocomplete="name" value="${esc(nombreCliente)}"${metodoPago ? "" : " disabled"}>
        ${metodoPago ? "" : `<p class="pago-nota">Primero elegí tu método de pago.</p>`}
        <div class="compra" id="compra" hidden>
          <p class="compra-texto"><strong>Al tocar Comprar no se te cobra nada.</strong> Solo se abre un chat de WhatsApp con el detalle de tu pedido. El pago lo hacés vos manualmente, por transferencia a la cuenta de arriba. Y después adjuntás el comprobante en ese mismo chat.</p>
          <a class="cta" id="enviar" href="#" target="_blank" rel="noopener">${WA_ICON} Comprar</a>
        </div>
      </div>`;
    actualizarEstado();
  }

  function cuentasHtml(){
    if(!metodoPago) return "";
    const cuentas = CUENTAS_PAGO.filter(c => c.tipo === metodoPago);
    return cuentas.map(c => {
      const datos = [["Cuenta a nombre de", c.titular, true], ["Alias", c.alias], ["CBU", c.cvu, true], c.cuit ? ["CUIT/CUIL", c.cuit] : null].filter(Boolean);
      return `<div class="cuenta"><p class="cuenta-titulo">${esc(c.nombre)}</p>` +
        datos.map(([k, v, sinCopiar]) => `<div class="dato"><div><small>${esc(k)}</small><span>${esc(v)}</span></div>${sinCopiar ? "" : `<button type="button" class="copiar" data-v="${esc(v)}">${COPIAR_ICONO}</button>`}</div>`).join("") + `</div>`;
    }).join("") || `<p class="vacio">No hay cuentas cargadas para este método.</p>`;
  }

  // Muestra el botón Comprar solo cuando están completos el paso 1 (método) y el paso 2 (nombre y apellido)
  function actualizarEstado(){
    const total = Object.keys(carrito).reduce((x, id) => x + carrito[id] * Number(productoPorId(id).precio), 0);
    const listo = !!metodoPago && nombreCliente.trim().length >= 2;
    const paso2 = document.getElementById("paso2");
    const paso3 = document.getElementById("paso3");
    const compra = document.getElementById("compra");
    if(paso2) paso2.classList.toggle("hecho", codigoValido(codigoRecomendacion));
    if(paso3) paso3.classList.toggle("hecho", listo);
    if(compra) compra.hidden = !listo;
    actualizarEnlaceCarrito(total);
  }

  function actualizarEnlaceCarrito(total){
    const a = document.getElementById("enviar");
    if(!a) return;
    const lineas = Object.keys(carrito).map(id => {
      const pr = productoPorId(id);
      return `• ${carrito[id]} x ${pr.nombre} (código ${pr.id}) - ${formatoPrecio(carrito[id] * Number(pr.precio))}`;
    }).join("\n");
    const texto = `Hola, hice el pago por ${formatoPrecio(total)}.\n\nPedido:\n${lineas}\n\n` +
      `Método: ${metodoPago === "naranjax" ? "Naranja X" : "transferencia bancaria"}` +
      (nombreCliente.trim() ? `\nNombre: ${nombreCliente.trim()}` : "") + (codigoValido(codigoRecomendacion) ? `\nCódigo de recomendación: ${codigoRecomendacion}` : "") + `\n\nTe paso el comprobante a continuación.`;
    a.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(texto)}`;
  }

  // Guarda la compra en la planilla de Google (hoja "Compras") a través del mismo Apps Script del stock.
  // Se manda en segundo plano: si falla, la compra por WhatsApp sigue igual.
  function registrarCompra(){
    const items = Object.keys(carrito).map(id => {
      const pr = productoPorId(id);
      return { codigo: pr.id, nombre: pr.nombre, cantidad: carrito[id], precio: Number(pr.precio) || 0 };
    });
    const total = items.reduce((x, i) => x + i.cantidad * i.precio, 0);
    const datos = {
      pedido: "P" + Date.now().toString(36).toUpperCase(),
      fecha: new Date().toISOString(),
      cliente: nombreCliente.trim(),
      metodo: metodoPago === "naranjax" ? "Naranja X" : "Transferencia bancaria",
      revendedor: codigoValido(codigoRecomendacion) ? codigoRecomendacion : "No",
      total: total,
      items: items
    };
    try{
      fetch(SHEET_API_URL, {
        method: "POST", mode: "no-cors", keepalive: true,
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(datos)
      }).catch(() => {});
    }catch(e){}
  }

  function abrirConfirmacion(){
    document.getElementById("confirmarDetalle").textContent = "Si confirmás, te llevamos a WhatsApp para enviar el detalle y el comprobante de pago.";
    document.getElementById("confirmar").hidden = false;
    document.getElementById("confirmarSi").focus();
  }
  function cerrarConfirmacion(){ document.getElementById("confirmar").hidden = true; }

  function iniciarConfirmacion(){
    document.getElementById("confirmarNo").addEventListener("click", cerrarConfirmacion);
    document.getElementById("confirmar").addEventListener("click", e => { if(e.target.id === "confirmar") cerrarConfirmacion(); });
    document.addEventListener("keydown", e => { if(e.key === "Escape") cerrarConfirmacion(); });
    document.getElementById("confirmarSi").addEventListener("click", () => {
      const a = document.getElementById("enviar");
      const destino = a ? a.href : "";
      cerrarConfirmacion();
      if(!destino || !Object.keys(carrito).length) return;
      registrarCompra();
      window.open(destino, "_blank", "noopener");
    });
  }

  function iniciarCarrito(){
    iniciarConfirmacion();
    actualizarInsignia();
    document.getElementById("carritoBtn").addEventListener("click", () => {
      cerrarBusqueda();
      if(location.hash === "#carrito") mostrar(); else location.hash = "#carrito";
    });
    document.getElementById("grid").addEventListener("click", e => {
      const b = e.target.closest(".btn-carrito");
      if(b){ agregarAlCarrito(b.dataset.id, b); return; }
      const cmp = e.target.closest("[data-compartir]");
      if(cmp){ compartirPieza(cmp.dataset.compartir, cmp); return; }
      const tarjeta = e.target.closest(".product");
      if(tarjeta) abrirDetalle(tarjeta.dataset.id);
    });
    const det = document.getElementById("detalle");
    det.addEventListener("click", e => {
      if(e.target === det || e.target.closest("[data-cerrar]")){ cerrarDetalle(); return; }
      const b = e.target.closest(".btn-carrito");
      if(b && !b.disabled){ agregarAlCarrito(b.dataset.id, b); return; }
      const c = e.target.closest("[data-compartir]");
      if(c) compartirPieza(c.dataset.compartir, c);
    });
    document.addEventListener("keydown", e => {
      if(e.key === "Escape" && !det.hidden) cerrarDetalle();
    });
    const cont = document.getElementById("pago");
    cont.addEventListener("click", e => {
      if(e.target.closest("#enviar")){ e.preventDefault(); abrirConfirmacion(); return; }
      const m = e.target.closest(".metodo");
      if(m){ metodoPago = m.dataset.m; renderCarrito(); return; }
      const c = e.target.closest(".copiar");
      if(c){ copiarTexto(c.dataset.v, c); return; }
      const acc = e.target.closest("[data-a]");
      if(acc){
        const id = acc.closest(".item").dataset.id;
        const pr = productoPorId(id);
        if(acc.dataset.a === "mas" && carrito[id] < (Number(pr.stock) || 0)) carrito[id]++;
        else if(acc.dataset.a === "menos" && carrito[id] > 1) carrito[id]--;
        else if(acc.dataset.a === "quitar") delete carrito[id];
        guardarCarrito();
        renderCarrito();
      }
    });
    cont.addEventListener("input", e => {
      if(e.target.id === "codigoRev"){
        e.target.value = e.target.value.trim().toUpperCase();
        codigoRecomendacion = e.target.value;
        actualizarEstado();
        return;
      }
      if(e.target.id !== "cliente") return;
      nombreCliente = e.target.value;
      actualizarEstado();
    });
  }

  // Ventana ampliada de una pieza: foto grande a la izquierda y datos a la derecha
  function abrirDetalle(id){
    const p = productoPorId(id);
    if(!p) return;
    const agotado = (Number(p.stock) || 0) <= 0;
    const tieneFoto = !!(p.foto && String(p.foto).trim());
    document.getElementById("detalleCuerpo").innerHTML = `
      <div class="detalle-foto${tieneFoto ? " con-foto" : ""}">
        ${tieneFoto ? `<img src="${esc(fotoHD(p.foto, 1200))}" alt="${esc(p.nombre)}">` : FOTO_GENERICA}
      </div>
      <div class="detalle-info">
        <p class="product-category">${esc(p.categoria)}</p>
        <h2 class="product-name">${esc(p.nombre)}</h2>
        ${Number(p.precio) > 0 ? `<p class="product-price">${formatoPrecio(p.precio)}</p>` : ""}
        ${medidasHTML(p)}
        <p class="product-specs">${esc(p.especificaciones)}</p>
        <p class="product-stock">${agotado
          ? `<span class="agotado-tag">Stock no disponible</span>`
          : `<strong>Stock disponible</strong>`}</p>
        <div class="detalle-acciones">
          <button type="button" class="cta btn-carrito" data-id="${esc(p.id)}"${agotado ? " disabled" : ""}>${CARRITO_ICON} Añadir al carrito</button>
          <button type="button" class="btn-compartir" data-compartir="${esc(p.id)}">Compartir</button>
        </div>
      </div>`;
    document.getElementById("detalle").hidden = false;
    document.body.style.overflow = "hidden";
  }

  // Link directo de cada pieza: #pieza=ID
  const SITIO_PUBLICO = "https://chahnajoyas.netlify.app";
  function linkPieza(id){
    return `${SITIO_PUBLICO}/#pieza=${encodeURIComponent(id)}`;
  }

  async function compartirPieza(id, btn){
    const p = productoPorId(id);
    if(!p) return;
    const url = linkPieza(p.id);
    const texto = `${p.nombre} · ${formatoPrecio(p.precio)} · Chahna Joyas`;
    if(navigator.share){
      try{ await navigator.share({ title: p.nombre, text: texto, url }); return; }catch(e){
        if(e && e.name === "AbortError") return;
      }
    }
    const original = btn.textContent;
    try{
      await navigator.clipboard.writeText(url);
      btn.textContent = "¡Link copiado!";
    }catch(e){
      window.prompt("Copiá este link:", url);
    }
    setTimeout(() => { btn.textContent = original; }, 1500);
  }

  // Si la dirección trae #pieza=ID, abre directo esa pieza
  function abrirPiezaDesdeHash(){
    const m = location.hash.match(/^#pieza=([^&]+)/);
    if(!m) return;
    const p = productoPorId(decodeURIComponent(m[1]));
    if(p) abrirDetalle(p.id);
  }

  function cerrarDetalle(){
    const det = document.getElementById("detalle");
    if(det.hidden) return;
    det.hidden = true;
    document.getElementById("detalleCuerpo").innerHTML = "";
    document.body.style.overflow = "";
  }

  // Decide qué mostrar según el # de la dirección:  #  |  #aros  |  #aros/aab
  function mostrar(){
    cerrarDetalle();
    const partes = location.hash.slice(1).split("/").map(s => decodeURIComponent(s).toLowerCase());
    const grupo = obtenerGrupos().find(g => g.key === partes[0]);
    const tipo = grupo && partes[1] ? obtenerTipos(grupo.key).find(t => t.key === partes[1]) : null;

    const barra = document.getElementById("barra");
    const catGrid = document.getElementById("catGrid");
    const grid = document.getElementById("grid");
    const pagoEl = document.getElementById("pago");
    grid.innerHTML = "";
    pagoEl.style.display = "none";
    pagoEl.innerHTML = "";

    // Carrito y cobro:  #carrito
    if(partes[0] === "carrito"){
      catGrid.style.display = "none";
      grid.style.display = "none";
      barra.style.display = "flex";
      barra.innerHTML = `<a class="volver" href="#">← Seguir comprando</a><h2 class="titulo-cat">Carrito</h2>`;
      pagoEl.style.display = "";
      renderCarrito();
      window.scrollTo(0, 0);
      return;
    }

    if(grupo && tipo){
      catGrid.style.display = "none";
      grid.style.display = "";
      barra.style.display = "flex";
      barra.innerHTML = `<a class="volver" href="#${encodeURIComponent(grupo.key)}">← ${esc(grupo.label)}</a><h2 class="titulo-cat">${esc(tipo.label)}</h2>`;
      renderGrid(grupo.key, tipo.key);
    }else if(grupo){
      grid.style.display = "none";
      catGrid.style.display = "";
      barra.style.display = "flex";
      barra.innerHTML = `<a class="volver" href="#">← Categorías</a><h2 class="titulo-cat">${esc(grupo.label)}</h2>`;
      renderTipos(grupo);
    }else{
      barra.style.display = "none";
      grid.style.display = "none";
      catGrid.style.display = "";
      renderGrupos();
    }
    if(pendienteIr){
      // Venimos del buscador: ir a la pieza elegida y resaltarla un momento
      const id = pendienteIr;
      pendienteIr = null;
      const tarjeta = [...document.querySelectorAll(".product")].find(el => el.dataset.id === id);
      if(tarjeta){
        tarjeta.scrollIntoView({ behavior: "smooth", block: "center" });
        tarjeta.classList.add("destacada");
        setTimeout(() => tarjeta.classList.remove("destacada"), 2500);
        return;
      }
    }
    window.scrollTo(0, 0);
  }

  // ---------- Buscador ----------
  let pendienteIr = null;   // id de la pieza a mostrar después de navegar
  let sugActual = [];       // sugerencias visibles
  let sugIndice = -1;       // sugerencia marcada con el teclado

  // Texto en minúsculas y sin tildes, y por cada letra su posición en el texto original
  function normalizarConMapa(texto){
    const s = String(texto == null ? "" : texto);
    let n = "";
    const idx = [];
    for(let i = 0; i < s.length; i++){
      const base = s[i].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
      for(const ch of base){ n += ch; idx.push(i); }
    }
    return { n, idx };
  }

  function tokensDe(q){
    return normalizarConMapa(q).n.split(/\s+/).filter(Boolean);
  }

  // Devuelve el texto con lo escrito marcado en verde claro: ani -> <mark>ani</mark>llo
  function resaltar(texto, tokens){
    const s = String(texto == null ? "" : texto);
    const { n, idx } = normalizarConMapa(s);
    const marcado = new Array(s.length).fill(false);
    tokens.forEach(t => {
      let pos = n.indexOf(t);
      while(pos !== -1){
        for(let k = pos; k < pos + t.length; k++) marcado[idx[k]] = true;
        pos = n.indexOf(t, pos + t.length);
      }
    });
    let html = "";
    let abierto = false;
    for(let i = 0; i < s.length; i++){
      if(marcado[i] && !abierto){ html += "<mark>"; abierto = true; }
      if(!marcado[i] && abierto){ html += "</mark>"; abierto = false; }
      html += esc(s[i]);
    }
    if(abierto) html += "</mark>";
    return html;
  }

  // Busca en nombre, tipo, categoría y código. Todas las palabras escritas tienen que aparecer.
  function buscarProductos(q){
    const tokens = tokensDe(q);
    if(!tokens.length) return { tokens, items: [] };
    const items = [];
    lista().forEach(p => {
      const campo = normalizarConMapa([p.nombre, p.tipo, p.categoria, p.id].join(" ")).n;
      if(!tokens.every(t => campo.includes(t))) return;
      const nombre = normalizarConMapa(p.nombre).n;
      // Mejor puntaje si el nombre empieza con lo escrito, luego si una palabra empieza con eso
      const puntaje = tokens.reduce((suma, t) =>
        suma + (nombre.startsWith(t) ? 0 : nombre.includes(" " + t) ? 1 : 2), 0);
      items.push({ p, puntaje });
    });
    items.sort((a, b) =>
      (Number(!tieneStock(a.p)) - Number(!tieneStock(b.p))) ||
      (a.puntaje - b.puntaje) ||
      String(a.p.nombre).localeCompare(String(b.p.nombre), "es"));
    return { tokens, items: items.map(x => x.p) };
  }

  function cerrarSugerencias(){
    const cont = document.getElementById("sugerencias");
    cont.hidden = true;
    cont.innerHTML = "";
    sugActual = [];
    sugIndice = -1;
  }

  function renderSugerencias(){
    const cont = document.getElementById("sugerencias");
    const { tokens, items } = buscarProductos(document.getElementById("q").value);
    sugActual = items.slice(0, 8);
    sugIndice = -1;
    if(!tokens.length){ cerrarSugerencias(); return; }
    if(!items.length){
      cont.innerHTML = `<div class="sug-vacio">No encontramos piezas con ese nombre.</div>`;
      cont.hidden = false;
      return;
    }
    cont.innerHTML = sugActual.map((p, i) => {
      const agot = !tieneStock(p);
      const miniatura = (p.foto && String(p.foto).trim())
        ? `<img src="${esc(fotoHD(p.foto, 200))}" alt="" loading="lazy">`
        : FOTO_GENERICA;
      return `
        <div class="sug${agot ? " agotado" : ""}" role="option" data-i="${i}">
          <div class="sug-foto">${miniatura}</div>
          <div class="sug-texto">
            <div class="sug-nombre">${resaltar(p.nombre, tokens)}</div>
            ${agot ? `<div class="sug-detalle">Stock no disponible</div>` : ""}
          </div>
        </div>`;
    }).join("") + (items.length > sugActual.length
      ? `<div class="sug-mas">y ${items.length - sugActual.length} más. Seguí escribiendo para afinar.</div>`
      : "");
    cont.hidden = false;
  }

  // Al elegir una sugerencia: ir a su tipo y mostrar esa pieza
  function irAPieza(p){
    pendienteIr = p.id;
    const destino = "#" + encodeURIComponent(norm(p.categoria)) + "/" + encodeURIComponent(norm(p.codigo));
    cerrarBusqueda();
    if(location.hash === destino) mostrar(); else location.hash = destino;
  }

  function marcarSugerencia(i){
    const filas = document.querySelectorAll("#sugerencias .sug");
    filas.forEach(f => f.classList.remove("activa"));
    sugIndice = i;
    if(filas[i]){
      filas[i].classList.add("activa");
      filas[i].scrollIntoView({ block: "nearest" });
    }
  }

  // Lupa arriba a la izquierda: el buscador reemplaza a todo lo que hay en el escalón de arriba
  function abrirBusqueda(){
    document.getElementById("cabecera").classList.add("buscando");
    document.getElementById("q").focus();
  }
  function cerrarBusqueda(){
    document.getElementById("cabecera").classList.remove("buscando");
    document.getElementById("q").value = "";
    cerrarSugerencias();
  }

  function iniciarBuscador(){
    const q = document.getElementById("q");
    const cont = document.getElementById("sugerencias");
    document.getElementById("buscador").style.display = "";
    document.getElementById("lupaBtn").hidden = false;
    document.getElementById("lupaBtn").addEventListener("click", abrirBusqueda);
    document.getElementById("atrasBtn").addEventListener("click", cerrarBusqueda);

    q.addEventListener("input", renderSugerencias);
    q.addEventListener("focus", () => { if(q.value.trim()) renderSugerencias(); });
    q.addEventListener("keydown", e => {
      if(e.key === "ArrowDown" && sugActual.length){ e.preventDefault(); marcarSugerencia((sugIndice + 1) % sugActual.length); }
      else if(e.key === "ArrowUp" && sugActual.length){ e.preventDefault(); marcarSugerencia((sugIndice - 1 + sugActual.length) % sugActual.length); }
      else if(e.key === "Enter" && sugActual.length){ e.preventDefault(); irAPieza(sugActual[sugIndice >= 0 ? sugIndice : 0]); }
      else if(e.key === "Escape"){ cerrarBusqueda(); }
    });
    // mousedown (y no click) para que funcione antes de que el campo pierda el foco
    cont.addEventListener("mousedown", e => {
      const fila = e.target.closest(".sug");
      if(!fila) return;
      e.preventDefault();
      irAPieza(sugActual[Number(fila.dataset.i)]);
    });
    document.addEventListener("click", e => {
      if(!e.target.closest(".buscador-caja")) cerrarSugerencias();
    });
  }

  async function cargarStock(){
    const status = document.getElementById("status");
    try{
      const res = await fetch(SHEET_API_URL);
      if(!res.ok) throw new Error("Respuesta no válida");
      productos = await res.json();
      // Aviso de prueba: si el script todavía manda datos de la versión anterior (sin "codigo"), lo dice.
      // Se puede borrar este bloque cuando todo funcione.
      if(Array.isArray(productos) && productos.length && productos[0].codigo === undefined){
        status.textContent = "El script de Google todavía está enviando datos de la versión anterior. Falta publicar la versión nueva: en Apps Script, Implementar → Administrar implementaciones → lápiz → Versión: Nueva versión → Implementar.";
        return;
      }
      status.style.display = "none";
      limpiarCarrito();
      mostrar();
      iniciarBuscador();
      iniciarCarrito();
      window.addEventListener("hashchange", mostrar);
      window.addEventListener("hashchange", abrirPiezaDesdeHash);
      abrirPiezaDesdeHash();
    }catch(err){
      status.textContent = "No pudimos cargar el stock en este momento. Probá recargar la página en unos minutos.";
    }
  }

  cargarStock();
</script>

  <div class="detalle" id="detalle" hidden>
    <div class="detalle-caja" role="dialog" aria-modal="true">
      <button type="button" class="detalle-cerrar" data-cerrar aria-label="Cerrar">×</button>
      <div id="detalleCuerpo"></div>
    </div>
  </div>
